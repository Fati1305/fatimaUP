<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .rojo {
      display: inline-block;
      background: #ff0000;
      height: 50px;
      width: 50px;
      color: #ffffff;
    }

    .azul {
      display: inline-block;
      background: #0000ff;
      height: 50px;
      width: 50px;
      color: #ffffff;
    }

    img {
      width: 100%;
    }
    .contenedor {
      display: flex;
      flex-direction: row-reverse;
      justify-content: space-between;
    }
  </style>
  <body>
    <div class="contenedor">
      <div class="rojo">
        <img src="happy.png" alt="carita feliz" />
      </div>
      <div class="azul">
        <img src="guiño.png" alt="carita guiñando el ojo" />
      </div>
    </div>
  </body>
</html>
