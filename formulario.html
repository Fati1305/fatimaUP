<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form id="Miformulario">
      <label>Nombre:</label>
      <input type="text" id="Minombre" required /><br />
      <br />
      <label>Email:</label>
      <input type="email" id="Micorreo" required /><br />
      <p>Sexo:</p>
      <input type="radio" id="fem" name="sexo" value="60" />
      <label for="fem">Femenino</label><br />
      <input type="radio" id="masc" name="sexo" value="100" />
      <label for="masc">Masculino</label><br /><br />
      <button type="submit" onclick="alert('Hola')">Enviar</button>
    </form>

    <style>
      label {
        font-weight: regular;
        margin-right: 10px;
      }
      input[type="text"],
      input[type="email"] {
        padding: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
        width: 100%;
        max-width: 300px;
        margin-bottom: 15px;
      }
      button {
        background-color: #4f0c28;
        color: #fff;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        align-items: center;
      }
      button:hover {
        background-color: #7f455d;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #022e4c;
        color: #e2d9cb;
        line-height: 1.6;
        padding: 25px;
        margin: 0;
      }
      p {
        font-weight: regular;
        margin-bottom: 10px;
      }
    </style>
  </body>
</html>
