<html lang="es">
  <head>
    <meta charset="UTF-8" />

      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- navbar -->
    <nav class="navbar navbar-expand-md" id="barra">
      <div class="container">
        <a class="navbar-brand" href="../index.html">Diseño Interactivo</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            </li>
            <li class="nav-item">
              <a class="nav-link" href="habilidades.html">Habilidades</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="certificaciones.html"
                >Certificaciones</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="softwares.html">Softwares</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" id="btn-nav" href="formulario.html"
                >Contáctame</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- breadcrumbs... -->
    <div class="container mt-3">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="../index.html">Inicio</a></li>
          <li class="breadcrumb-item active" aria-current="page">Contáctame</li>
        </ol>
      </nav>
    </div>

    <!-- intro  -->
    <main class="container seccion">
      <h2>Llena tus datos</h2>
      <p class="text-center subtitulo mb-4">
        Me encantaría colaborar contigo. No dudes en enviarme un mensaje con tus ideas.
      </p>

      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <form id="Forms" class="form-card p-4" novalidate>
            <div class="mb-3">
              <label for="name" class="form-label">Nombre</label>
              <input
                type="text"
                class="form-control campo-form"
                id="name"
                name="name"
                placeholder="Tu nombre..."
                required
              />
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control campo-form"
                id="email"
                name="email"
                placeholder="Tu email..."
                required
              />
            </div>

            <div class="mb-3">
              <label for="mensaje" class="form-label">Mensaje</label>
              <textarea
                class="form-control campo-form"
                id="mensaje"
                name="mensaje"
                rows="4"
                placeholder="Escribe tu mensaje..."
                required
              ></textarea>
            </div>

            <button type="submit" class="btn btn-enviar w-100">
              <i class="bi bi-send me-2"></i>Enviar
            </button>
          </form>

          <div id="resultado" class="resultado-msg mt-3"></div>
        </div>
      </div>
    </main>

    <hr />

    <div class="container" id="contacto">
      <a href="mailto:fati9802@gmail.com">Mándame un correo</a>
      <p class="separador-contacto">|</p>
      <a href="https://wa.me/7771034606">Mándame un WhatsApp</a>
    </div>

    <footer>Fátima Oregel Cárdenas © 2025</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const form = document.getElementById("Forms");
      const visor = document.getElementById("resultado");

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        const datos = new FormData(form);
        const name = datos.get("name");
        const email = datos.get("email");
        const mensaje = datos.get("mensaje");

        visor.innerHTML =
          '<i class="bi bi-check-circle me-2"></i>¡Gracias ' +
          name +
          "! Tu mensaje fue recibido, te contactaré pronto a " +
          email +
          ".";

        console.log("Datos recibidos:", name, email, mensaje);
        form.reset();
      });
    </script>

    <style>
      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #fdf3e9;
        color: #ad9878;
        margin: 0;
        padding: 0;
      }

      /* navbar */
      #barra {
        background-color: #91744d;
        padding: 12px 0;
      }
      #barra .navbar-brand {
        color: #e3edca;
        font-size: 20px;
      }
      #barra .nav-link {
        color: #2c4609;
        padding: 6px 12px;
      }
      #barra .nav-link:hover,
      #barra .nav-link.active {
        color: #738232;
      }
      #btn-nav {
        color: #487511 !important;
        font-weight: bold;
      }
      #barra .nav-item {
        background-color: #edddcc;
        border-radius: 8px;
        margin: 4px;
      }

      /* crumbs */
      .breadcrumb-item a {
        color: #8a7455;
        text-decoration: none;
      }
      .breadcrumb-item a:hover {
        color: #f2c76b;
      }
      .breadcrumb-item.active {
        color: #917601;
      }
      .breadcrumb-item + .breadcrumb-item::before {
        color: #ad9878;
      }

      /* títulos */
      h2 {
        font-weight: 400;
        font-size: 22px;
        letter-spacing: 1px;
        text-align: center;
        margin-bottom: 8px;
        color: #917601;
      }
      .subtitulo {
        color: #ad9878;
        font-size: 14px;
      }

      /* form estilo */
      .form-card {
        background-color: #4a6350;
        border: 1px solid #5a7a5c;
        border-radius: 12px;
        color: #f7ead7;
      }

      .form-label {
        color: #f7ead7;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 6px;
      }

      .campo-form {
        background-color: #fdf3e9;
        border: 1px solid #5a7a5c;
        border-radius: 8px;
        color: #5a4a35;
        padding: 10px 12px;
      }

      .campo-form:focus {
        background-color: #fff;
        border-color: #c9a97a;
        box-shadow: 0 0 0 0.2rem rgba(201, 169, 122, 0.3);
        color: #5a4a35;
      }

      .campo-form::placeholder {
        color: #b5a890;
      }

      /* botón de envío */
      .btn-enviar {
        background-color: #738d3f;
        color: #f7ead7;
        border: none;
        border-radius: 20px;
        padding: 10px;
        font-weight: 600;
        margin-top: 8px;
      }

      .btn-enviar:hover {
        background-color: #4a5e3a;
        color: #f7ead7;
      }

      /* pop - up mensaje */
      .resultado-msg {
        background-color: #edddcc;
        border-left: 5px solid #738d3f;
        border-radius: 8px;
        padding: 12px 16px;
        color: #4a5e3a;
        font-size: 14px;
        display: none;
      }

      .resultado-msg:not(:empty) {
        display: block;
      }

      /* sección */
      .seccion {
        padding: 30px 20px;
      }

      /* contacto */
      #contacto {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        padding: 20px;
        flex-wrap: wrap;
      }
      .separador-contacto {
        color: #8a9a80;
        margin: 0;
      }
      a {
        color: #8a7455;
        text-decoration: none;
      }
      a:hover {
        color: #f2c76b;
      }

      footer {
        display: flex;
        justify-content: center;
        margin-top: 40px;
        color: #a2a1a1;
        font-size: 14px;
        padding-bottom: 20px;
      }
    </style>
  </body>
</html>
